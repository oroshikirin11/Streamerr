services:
  streamerr:
    build: .
    image: streamerr:latest
    container_name: streamerr
    restart: unless-stopped

    ports:
      - "8099:8099"

    shm_size: "2gb"

    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128

    # Only needed when Docker itself runs inside an LXC (Proxmox): the gid of
    # the render group as the LXC sees it — `stat -c '%g' /dev/dri/renderD128`.
    # Keep the quotes.
    group_add:
      - "989"

    environment:
      - STREAMERR_CONFIG=/config/config.json
      # - STREAMERR_TRUST_PROXY=1
      # - LIBVA_DRIVER_NAME=iHD

    volumes:
      - ./config:/config
      - ./cache:/app/cache
      - ./overlays:/app/overlays
      # Your media, read-only. Left side: the folder on this machine.
      # Right side: the path the panel sees — pick it in the setup wizard.
      - /changeMe:/Media:ro
